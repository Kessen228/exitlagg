name: Сборка

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install psutil
      - name: Тесты
        run: python -m unittest discover -s tests -t . -v

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Тесты
        run: python -m unittest discover -s tests -t . -v
      - name: Сборка exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name LauncherScheduler
          --icon assets/icon.ico --add-data "assets;assets" --hidden-import pystray._win32 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: LauncherScheduler
          path: dist/LauncherScheduler.exe
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LauncherScheduler.exe
